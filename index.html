<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Héro de la Foi</title>
<meta name="description" content="Programme de formation biblique en 4 niveaux : cours, examens en ligne, attestations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout : en-tête sticky, colonne de lecture 960px ; niveaux codés par couleur, laiton = réussite / attestation */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface2:#eef1f8; --ink:#141b2e; --muted:#586078; --line:#d9deea;
  --navy:#1b2a4e; --brass:#a87b1f; --brass-soft:#f4ead3;
  --n1:#2f5fb3; --n2:#3f7d4e; --n3:#7a3f86; --n4:#a87b1f;
  --ok:#2e7d4f; --ok-soft:#e1f2e8; --bad:#b2392f; --bad-soft:#f8e3e1; --warn-soft:#fff4d6;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1422; --surface:#171e31; --surface2:#1f2840; --ink:#e8ebf4; --muted:#a2aac2; --line:#2c3652;
  --navy:#c9d5f5; --brass:#e0b85a; --brass-soft:#3a3018;
  --n1:#7ea6ef; --n2:#7fc38f; --n3:#c792d3; --n4:#e0b85a;
  --ok:#6fd39b; --ok-soft:#183a29; --bad:#f08a80; --bad-soft:#3d1f1d; --warn-soft:#3a3118; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1422; --surface:#171e31; --surface2:#1f2840; --ink:#e8ebf4; --muted:#a2aac2; --line:#2c3652;
  --navy:#c9d5f5; --brass:#e0b85a; --brass-soft:#3a3018;
  --n1:#7ea6ef; --n2:#7fc38f; --n3:#c792d3; --n4:#e0b85a;
  --ok:#6fd39b; --ok-soft:#183a29; --bad:#f08a80; --bad-soft:#3d1f1d; --warn-soft:#3a3118; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;color:var(--ink)}
h1{font-size:clamp(1.7rem,4vw,2.4rem)} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--n1)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
.brand svg{width:28px;height:28px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--surface2);color:var(--ink)}
main{padding-block:28px 64px;display:grid;gap:28px}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);font-size:.95rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.lead{color:var(--muted);max-width:65ch}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:#1a1405}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:.9rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.hero{display:grid;gap:12px}
.verse{font-family:var(--display);font-style:italic;color:var(--muted);max-width:65ch}
/* niveaux */
.levels{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.level{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;border-top:5px solid var(--lc)}
.level .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.level .num{font-weight:700;color:var(--lc);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--lc);border-radius:99px}
.mods{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.mods button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer}
.mods button:hover{border-color:var(--lc)}
.mods .t{flex:1;min-width:0}
.pill{align-self:center;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.cert{background:var(--brass-soft);color:var(--brass);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dot{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--surface);color:var(--muted);border:1.5px solid var(--line)}
.dot.done{background:var(--brass);color:#1a1405;border-color:var(--brass)}
/* module */
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.crumbs button{background:none;border:0;color:var(--n1);cursor:pointer;padding:0;font-weight:600}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.step b{display:block;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.step.on{border-color:var(--ok);background:var(--ok-soft)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.lesson summary{cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:center;list-style:none}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary h3{flex:1;min-width:0}
.lesson .body{padding:0 18px 18px;display:grid;gap:12px;max-width:72ch}
.refs{display:flex;gap:6px;flex-wrap:wrap}
.ref{font-size:.82rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--navy)}
.keep{border-left:4px solid var(--brass);background:var(--brass-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-weight:600}
.apply{color:var(--muted)} .apply b{color:var(--ink)}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);resize:vertical}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg)}
label.f{display:grid;gap:4px;font-weight:600;font-size:.95rem}
.hint{font-size:.88rem;color:var(--muted);font-weight:400}
/* examen */
.q{display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q legend{font-weight:700;padding:0;margin-bottom:6px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-top:6px;background:var(--surface)}
.opt input{margin-top:5px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums}
/* attestation preview */
.cert{border:2px solid var(--brass);outline:6px double var(--brass-soft);border-radius:6px;padding:28px 20px;text-align:center;display:grid;gap:10px;background:var(--surface)}
.cert .nm{font-family:var(--display);font-size:1.8rem;color:var(--navy)}
/* enseignant */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .v{font-family:var(--display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.9rem}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.empty{padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.prog-table td:first-child{min-width:220px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}
.auth{display:grid;gap:14px;max-width:520px}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.pw{position:relative;display:block}
.pw input[type=password]{padding-right:96px}
.pw-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--surface2);color:var(--ink);font-weight:600;font-size:.88rem;padding:5px 10px;border-radius:8px;cursor:pointer}
.pw input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 96px 9px 12px;background:var(--bg)}
input[type=email],input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg)}
.level.locked{opacity:.72}
.lockmsg{font-size:.9rem;color:var(--muted);background:var(--surface2);padding:8px 10px;border-radius:8px}
.mods button[aria-disabled="true"]{cursor:not-allowed;opacity:.7}
.lesson .body{max-width:76ch}
.lesson h4{font-family:var(--display);font-size:1.05rem;margin:6px 0 2px}
.block{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.block ul,.block ol,.keep ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.block.story{background:var(--surface2);border:0;border-radius:12px;padding:16px}
.block.case{background:var(--warn-soft);border:0;border-radius:12px;padding:16px}
.block.memo{border-top:0}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:5px;width:18px;height:18px;flex:none}
.words{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.word{background:var(--surface2);border-radius:10px;padding:10px 12px}
blockquote{margin:0;border-left:4px solid var(--navy);padding:8px 14px;background:var(--surface2);border-radius:0 10px 10px 0;font-family:var(--display);font-style:italic}
blockquote cite{display:block;font-family:var(--body);font-style:normal;font-size:.85rem;color:var(--muted);margin-top:4px}
.readlist{margin:8px 0 0;padding-left:1.2em;display:grid;gap:6px}
.prose{display:grid;gap:10px;max-width:76ch}
fieldset.q legend{float:left;width:100%}
fieldset.q legend + *{clear:both}
.counter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:3;justify-self:start;background:var(--navy);color:var(--bg);font-weight:700;padding:6px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="brand" type="button" aria-label="Accueil">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 L28 8 V16 C28 23 22.5 27.5 16 29 C9.5 27.5 4 23 4 16 V8 Z" fill="var(--navy)"/><path d="M16 9 V23 M11 14 H21" stroke="var(--brass)" stroke-width="2.6" stroke-linecap="round"/></svg>
    Héro de la Foi
  </button>
  <nav class="tabs" aria-label="Navigation" id="nav" hidden>
    <button type="button" data-view="parcours" id="tab-parcours">Mon parcours</button>
    <button type="button" data-view="programme" id="tab-programme">Programme</button>
    <button type="button" data-view="enseignant" id="tab-enseignant" hidden>Espace enseignant</button>
    <button type="button" id="logout">Se déconnecter</button>
  </nav>
</div></header>

<div class="wrap"><main id="app"><div class="empty">Chargement…</div></main></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
